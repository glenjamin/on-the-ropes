<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#120d1c" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="On the Ropes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>On the Ropes</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #120d1c;
        color: #f4ecff;
        font-family: system-ui, -apple-system, sans-serif;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        display: block;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #hud {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: max(16px, env(safe-area-inset-left));
        right: max(16px, env(safe-area-inset-right));
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 1px 3px #000a;
      }
      #time { font-size: 22px; font-weight: 700; }
      #best { font-size: 13px; opacity: 0.75; }
      #level-name { font-size: 13px; opacity: 0.75; margin-bottom: 2px; white-space: pre; }
      .hud-buttons { display: flex; gap: 8px; }
      .btn {
        pointer-events: auto;
        background: #ffffff1f;
        color: inherit;
        border: 1px solid #ffffff33;
        border-radius: 999px;
        padding: 8px 14px;
        font: inherit;
        font-size: 14px;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        text-align: center;
        background: #120d1ccc;
        pointer-events: none;
      }
      #overlay.show { display: grid; }
      #overlay.clear { background: transparent; align-items: start; padding-top: 12vh; }
      #overlay.clear > div { background: #120d1cd9; padding: 16px 28px; border-radius: 16px; }
      #overlay h1 { margin: 0 0 8px; font-size: 40px; }
      #overlay p { margin: 4px 0; opacity: 0.85; }
      #overlay button { pointer-events: auto; }
      .btn.primary { background: #8cffb4; color: #120d1c; border-color: #8cffb4; font-weight: 600; }
      .actions { display: flex; gap: 12px; justify-content: center; margin-top: 16px; }
      .menu { max-height: 100dvh; overflow-y: auto; padding: 12px 16px; box-sizing: border-box; pointer-events: auto; }
      .menu h2 { margin: 12px 0 8px; font-size: 15px; font-weight: 600; opacity: 0.7; }
      .set { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      .level-btn {
        display: grid;
        gap: 2px;
        min-width: 130px;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid #ffffff33;
        background: #ffffff14;
        color: inherit;
        font: inherit;
      }
      .level-btn small { opacity: 0.7; font-variant-numeric: tabular-nums; }
      .level-btn:disabled { opacity: 0.35; }
      #rotate {
        position: fixed;
        inset: 0;
        display: none;
        place-content: center;
        text-align: center;
        gap: 12px;
        background: #120d1c;
        font-size: 18px;
      }
      #rotate .icon { font-size: 56px; color: #8cffb4; }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: grid; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div>
        <div id="level-name"></div>
        <div id="time">0.00</div>
        <div id="best"></div>
      </div>
      <div class="hud-buttons">
        <button id="levels" class="btn" type="button">Levels</button>
        <button id="restart" class="btn" type="button">Restart</button>
      </div>
    </div>
    <div id="overlay"></div>
    <div id="rotate"><div class="icon">⟳</div><div>Turn your phone sideways to play</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
